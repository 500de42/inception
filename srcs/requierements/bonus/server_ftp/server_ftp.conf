listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=NO

#activation des logs
xferlog_enable=YES
xferlog_std_format=YES
xferlog_file=/var/log/vsftpd.log

ftpd_banner="WELCOME TO SKYLAND"

#lecture des fichiers
# anon_umask=022 
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html
secure_chroot_dir=/var/run/vsftpd/empty

pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=127.0.0.1
seccomp_sandbox=NO

